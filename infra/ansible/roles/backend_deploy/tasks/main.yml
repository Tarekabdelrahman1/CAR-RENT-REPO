---
- name: Pull backend image from Docker Hub
  command: "docker pull {{ docker_image_name }}:{{ docker_image_tag }}"

- name: Remove old container
  command: "docker rm -f {{ container_name }}"
  ignore_errors: yes

- name: Deploy backend env file
  template:
    src: backend.env.j2
    dest: /etc/carrento-backend.env
    mode: "0600"

- name: Fetch DB secret from Secrets Manager
  shell: |
    SECRET_ARN=$(grep DB_SECRET_ARN /etc/car-rent-app.env | cut -d= -f2)
    aws secretsmanager get-secret-value --secret-id "$SECRET_ARN" --region us-east-1 --query SecretString --output text
  register: db_secret_raw

- name: Parse DB credentials
  set_fact:
    db_password: "{{ (db_secret_raw.stdout | from_json).password }}"
    db_username: "{{ (db_secret_raw.stdout | from_json).username }}"

- name: Write DB credentials to env file
  copy:
    dest: /etc/carrento-db.env
    mode: "0600"
    content: |
      DB_USERNAME={{ db_username }}
      DB_PASSWORD={{ db_password }}

- name: Install postgresql client
  package:
    name: postgresql15
    state: present

- name: Enable uuid-ossp extension on RDS via docker
  shell: |
    docker run --rm \
      -e PGPASSWORD="{{ db_password }}" \
      -e DB_HOST=$(grep DB_HOST /etc/car-rent-app.env | cut -d= -f2) \
      -e DB_NAME=$(grep DB_NAME /etc/car-rent-app.env | cut -d= -f2) \
      postgres:15-alpine \
      sh -c 'psql "postgresql://{{ db_username }}@${DB_HOST}/${DB_NAME}?sslmode=require" -c "CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";"'
  register: ext_result
  changed_when: "'already exists' not in ext_result.stderr"
  failed_when: >
    ext_result.rc != 0 and
    'already exists' not in ext_result.stderr

- name: Run backend container
  command: >
    docker run -d
    --name {{ container_name }}
    --restart unless-stopped
    --network host
    --env-file /etc/car-rent-app.env
    --env-file /etc/carrento-backend.env
    --env-file /etc/carrento-db.env
    {{ docker_image_name }}:{{ docker_image_tag }}

- name: Wait for migrations to complete
  shell: docker inspect -f '{{ '{{' }}.State.Running{{ '}}' }}' {{ container_name }}
  register: container_state
  retries: 20
  delay: 10
  until: container_state.stdout == "true"
  failed_when: container_state.stdout != "true"

- name: Wait for backend to be healthy
  uri:
    url: "http://127.0.0.1:{{ container_port }}"
    status_code: [200, 302, 404]
  register: health
  retries: 30
  delay: 10
  until: health.status is defined

- name: Copy schema SQL to app server
  copy:
    src: schema.sql
    dest: /tmp/schema.sql
    mode: "0644"

- name: Copy seed SQL to app server
  copy:
    src: seed.sql
    dest: /tmp/seed.sql
    mode: "0644"

- name: Run schema SQL on RDS
  shell: |
    docker run --rm \
      -e PGPASSWORD="{{ db_password }}" \
      -e DB_HOST=$(grep DB_HOST /etc/car-rent-app.env | cut -d= -f2) \
      -e DB_NAME=$(grep DB_NAME /etc/car-rent-app.env | cut -d= -f2) \
      -v /tmp/schema.sql:/tmp/schema.sql \
      postgres:15-alpine \
      sh -c 'psql "postgresql://{{ db_username }}@${DB_HOST}/${DB_NAME}?sslmode=require" -f /tmp/schema.sql'
  register: schema_result
  failed_when: >
    schema_result.rc != 0 and
    'already exists' not in schema_result.stderr

- name: Run seed SQL on RDS
  shell: |
    docker run --rm \
      -e PGPASSWORD="{{ db_password }}" \
      -e DB_HOST=$(grep DB_HOST /etc/car-rent-app.env | cut -d= -f2) \
      -e DB_NAME=$(grep DB_NAME /etc/car-rent-app.env | cut -d= -f2) \
      -v /tmp/seed.sql:/tmp/seed.sql \
      postgres:15-alpine \
      sh -c 'psql "postgresql://{{ db_username }}@${DB_HOST}/${DB_NAME}?sslmode=require" -f /tmp/seed.sql'
  register: seed_result
  failed_when: >
    seed_result.rc != 0 and
    'already exists' not in seed_result.stderr and
    'duplicate key' not in seed_result.stderr
